<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BST OS</title>
<meta name="description" content="Sistem kasir, dapur, stok, dan keuangan Bubur Simpang Tiga">
<meta name="theme-color" content="#284891">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BST OS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: cobalt top band with BST mark; left rail of sections on tablet/desktop, scrolling tab strip on phone.
   Visual language: blue-ink stamp on warm paper, taken from the Bubur Simpang Tiga emblem. */
:root{
  --paper:#f3f1ec; --paper-2:#e9e5db; --card:#fbfaf6; --line:#d8d2c3; --line-ink:#c3cbe0;
  --ink:#284891; --ink-deep:#1b3373; --ink-soft:#e3e8f4; --on-ink:#f3f1ec;
  --text:#1c2747; --muted:#626a83;
  --ok:#2f7a4f; --ok-bg:#e1efe5; --warn:#a8670f; --warn-bg:#f7ead2; --bad:#b23a2c; --bad-bg:#f6e0dc;
  --f-display:"Young Serif", "Georgia", "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1630; --paper-2:#16204099; --card:#141e3c; --line:#26325a; --line-ink:#2f3d6b;
  --ink:#e9e3d3; --ink-deep:#f5f0e3; --ink-soft:#1e2a52; --on-ink:#132044;
  --text:#ebe7dc; --muted:#a3abc4;
  --ok:#6cc690; --ok-bg:#163327; --warn:#e8b25a; --warn-bg:#3a2c12; --bad:#ef8a7c; --bad-bg:#3d1d1a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1630; --paper-2:#16204099; --card:#141e3c; --line:#26325a; --line-ink:#2f3d6b;
  --ink:#e9e3d3; --ink-deep:#f5f0e3; --ink-soft:#1e2a52; --on-ink:#132044;
  --text:#ebe7dc; --muted:#a3abc4;
  --ok:#6cc690; --ok-bg:#163327; --warn:#e8b25a; --warn-bg:#3a2c12; --bad:#ef8a7c; --bad-bg:#3d1d1a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--text);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3,.serif{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.005em;text-wrap:balance}
h2{font-size:1.6rem;line-height:1.15;color:var(--ink)} h3{font-size:1.12rem;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.62rem .75rem;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
label{display:grid;gap:.3rem;font-size:.8rem;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--ink-soft)}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.pri:hover{background:var(--ink-deep)}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.34rem .75rem;font-size:.84rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:.84rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.ink{color:var(--ink)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--on-ink);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:.9rem;padding:.55rem var(--gutr) .55rem var(--gut)}
.mark{height:30px;width:auto;flex:0 0 auto;color:var(--on-ink)}
.top-title{display:grid;line-height:1.15;min-width:0}
.top-title b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title span{font-size:.75rem;opacity:.8}
.who{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.who .btn{color:var(--on-ink);border-color:color-mix(in srgb, var(--on-ink) 45%, transparent)}
.who .btn:hover{background:color-mix(in srgb, var(--on-ink) 14%, transparent)}
.who .nm{display:grid;text-align:right;line-height:1.2}
.who .nm small{opacity:.75;font-size:.72rem;text-transform:capitalize}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 50px)}
.rail{border-right:1.5px solid var(--line);padding:1rem .7rem 2rem;position:sticky;top:50px;align-self:start;height:calc(100vh - 50px);overflow:auto;display:grid;align-content:start;gap:1rem}
.rail .grp{display:grid;gap:.15rem}
.rail .grp-t{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:0 .7rem .2rem}
.nav{display:flex;align-items:center;gap:.65rem;border:0;background:transparent;padding:.55rem .7rem;border-radius:8px;font-weight:600;cursor:pointer;color:var(--text);text-align:left;width:100%}
.nav svg{width:19px;height:19px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--ink-soft)}
.nav[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .4rem;min-width:1.2rem;text-align:center}
.strip{display:none}
main{padding:1.4rem var(--gutr) 4rem var(--gut);min-width:0}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem;max-width:1180px}
.view > *,.grid2 > *,.stack > *,.pos > *,.panel > *{min-width:0}
@media (max-width:959px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .strip{display:flex;gap:.3rem;overflow-x:auto;background:var(--card);border-bottom:1.5px solid var(--line);padding:.4rem var(--gutr) .4rem var(--gut);position:sticky;top:calc(50px + env(safe-area-inset-top,0px));z-index:19;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip .nav{width:auto;white-space:nowrap;padding:.5rem .8rem}
  .strip .nav svg{display:none}
  .top-title span{display:none}
}
@media (max-width:520px){ .who .nm{display:none} }

/* ---------- blocks ---------- */
.head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.head > div{min-width:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:1rem}
.panel.ink-b{border-color:var(--line-ink)}
.panel > h3{margin-bottom:.7rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 150px;min-width:0}
.row > .btn,.row > .fit{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:1rem;align-items:start}
.stack{display:grid;gap:.8rem}
.tbl{overflow-x:auto;margin:0 -.2rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .55rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;white-space:nowrap}
.num{text-align:right!important;white-space:nowrap}
td input{padding:.4rem .5rem}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.74rem;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.idle{background:var(--paper-2);color:var(--muted)} .pill.ink{background:var(--ink-soft);color:var(--ink)}
.empty{padding:1.4rem 1rem;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:grid;gap:.6rem;justify-items:center}
.empty svg.emb{width:min(220px,70%);height:auto;color:var(--line-ink)}
.rule{height:0;border-top:1.5px dashed var(--line);margin:.2rem 0}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:.75rem}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;display:grid;gap:.15rem;align-content:start}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.2;color:var(--ink)}
.kpi .small{color:var(--muted)}
.kpi.lead{background:var(--ink);border-color:var(--ink)}
.kpi.lead b,.kpi.lead .eyebrow,.kpi.lead .small{color:var(--on-ink)}
.kpi.lead .eyebrow,.kpi.lead .small{opacity:.82}
.bars{display:flex;gap:4px;align-items:end;height:150px;padding-top:.5rem;overflow-x:auto;border-bottom:1.5px solid var(--line)}
.bar{flex:1 0 14px;background:var(--ink);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bar.dim{background:var(--line)}
.bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--paper);font-size:.74rem;padding:.2rem .45rem;border-radius:4px;white-space:nowrap;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);padding-top:.3rem;gap:.5rem}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;gap:.6rem;align-items:center;font-size:.88rem;padding:.25rem 0}
.hbar .num{text-align:right}
@media (max-width:520px){.hbar{grid-template-columns:80px minmax(0,1fr) 112px}}
.hbar .tr{height:10px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--ink);border-radius:99px}

/* home tasks */
.tasks{display:grid;gap:.5rem}
.task{display:flex;align-items:center;gap:.8rem;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--ink)}
.task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-ink);flex:0 0 auto;display:grid;place-items:center}
.task.done .ck{background:var(--ink);border-color:var(--ink)}
.task.done .ck::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--on-ink);border-bottom:2.5px solid var(--on-ink);transform:rotate(-45deg) translate(1px,-1px)}
.task.done b{text-decoration:line-through;text-decoration-color:var(--line-ink);color:var(--muted)}
.task div{display:grid;min-width:0} .task small{color:var(--muted)}
.task .go{margin-left:auto;color:var(--ink);font-weight:800}
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:1.2rem 1.3rem;overflow:hidden}
.hello h2{color:var(--on-ink);font-size:1.75rem}
.hello p{opacity:.85}
.hello svg{width:min(220px,32vw);height:auto;color:var(--on-ink);opacity:.95}
@media (max-width:560px){.hello{grid-template-columns:1fr}.hello svg{display:none}}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);grid-template-areas:"menu cart" "trx cart";gap:1rem;align-items:start}
.pos .p-menu{grid-area:menu} .pos .cart{grid-area:cart} .pos .p-trx{grid-area:trx}
@media (max-width:860px){.pos{grid-template-columns:minmax(0,1fr);grid-template-areas:"menu" "cart" "trx"}.cart{position:static}}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:.8rem}
.mbtn{position:relative;border:1.5px solid var(--line-ink);background:var(--card);border-radius:14px;padding:1rem 1rem .9rem;text-align:left;cursor:pointer;display:grid;gap:.45rem;min-height:clamp(132px,22vw,168px);align-content:end;overflow:hidden}
.mbtn:hover{border-color:var(--ink)}
.mbtn:active{transform:scale(.985)}
.mbtn .bowl{position:absolute;top:1.7rem;left:.9rem;width:46px;height:30px;border:2px solid var(--ink);border-top:0;border-radius:0 0 30px 30px}
.mbtn .bowl::before{content:"";position:absolute;left:-6px;right:-6px;top:-2px;border-top:2px solid var(--ink)}
.mbtn .bowl::after{content:"";position:absolute;left:14px;top:-16px;width:6px;height:12px;border-left:2px solid var(--ink);border-radius:50%;opacity:.7}
.mbtn .nm{font-family:var(--f-display);font-size:1.25rem;line-height:1.15;color:var(--ink)}
.mbtn .pr{font-weight:800}
.mbtn .badge{position:absolute;top:.7rem;right:.7rem;background:var(--ink);color:var(--on-ink);border-radius:99px;min-width:30px;height:30px;padding:0 .4rem;display:grid;place-items:center;font-weight:800}
.cart{position:sticky;top:70px;display:grid;gap:.75rem}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.5rem;align-items:center;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:.3rem}
.qty button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;font-size:1.1rem;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.total strong{font-family:var(--f-display);font-weight:400;font-size:2rem;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.3rem;background:var(--paper-2);padding:.3rem;border-radius:999px}
.seg button{border:0;background:transparent;padding:.55rem .8rem;border-radius:999px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.quick{display:flex;gap:.4rem;flex-wrap:wrap}
.quick .btn{flex:1 1 auto}
.pay{padding:.95rem;font-size:1.1rem}

/* prep flow */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35rem}
@media (max-width:640px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flow div{background:var(--paper-2);border-radius:8px;padding:.5rem .6rem;display:grid}
.flow span{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.flow b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;color:var(--ink)}
.flow .hl{background:var(--ink)} .flow .hl span,.flow .hl b{color:var(--on-ink)}

/* attendance */
.selfie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.shot{aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line-ink);border-radius:var(--r);display:grid;place-items:center;overflow:hidden;background:var(--paper-2);color:var(--muted);text-align:center;padding:.5rem;font-size:.85rem}
.shot img{width:100%;height:100%;object-fit:cover}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem}
.photos figure{margin:0;display:grid;gap:.25rem;font-size:.78rem}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--paper-2)}

/* login */
.auth{min-height:100%;display:grid;place-items:center;padding:2rem var(--gutr) 2rem var(--gut);background:var(--paper)}
.auth-card{width:min(100%,420px);display:grid;gap:1.1rem;justify-items:stretch}
.auth-card .logo-full{width:min(300px,80%);height:auto;justify-self:center;color:var(--ink)}
.auth-card .panel{display:grid;gap:.85rem;padding:1.3rem}
.pin{letter-spacing:.5em;font-size:1.3rem;text-align:center}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgb(10 16 38 / .55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:1.25rem;width:min(100%,460px);display:grid;gap:.95rem;max-height:calc(100vh - 32px);overflow:auto;border:1.5px solid var(--line-ink)}
.modal.wide{width:min(100%,720px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--paper);padding:.7rem 1.1rem;border-radius:999px;z-index:70;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--bad);color:#fff}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;background:var(--paper);border:1.5px dashed var(--line-ink);padding:1rem;border-radius:8px;white-space:pre;overflow-x:auto}
.upd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:.7rem .8rem .7rem 1rem;display:flex;gap:.8rem;align-items:center;font-weight:700}
.upd .btn{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="bst"><path fill="currentColor" fill-rule="evenodd" d="{{LOGO}}"/></g></defs>
</svg>

<div id="root"></div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
const CFG = window.BST_CONFIG || {};
const SB = supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:true, storageKey:"bst-os-auth"}});
const EMAIL_DOMAIN = "bst-os.app";
const pinPass = p => "bst-" + p;
const TZ = "Asia/Makassar";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => (Number(n) < 0 ? "−" : "") + "Rp" + Math.abs(Math.round(Number(n) || 0)).toLocaleString("id-ID");
const num = (n, d = 2) => (Number(n) || 0).toLocaleString("id-ID", {maximumFractionDigits: d});
const pn = v => { const s = String(v ?? "").trim(); if (!s) return 0; if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, "")); return Number(s.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, "")) || 0; };
const pd = v => { let s = String(v ?? "").trim(); if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, ""); return Number(s.replace(",", ".")) || 0; };
const today = () => new Date().toLocaleDateString("en-CA", {timeZone: TZ});
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"});
const fLong = d => new Date(d + "T12:00:00Z").toLocaleDateString("id-ID", {weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"});
const fTime = t => new Date(t).toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit", timeZone: TZ});
const fDT = t => new Date(t).toLocaleString("id-ID", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ});
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const errMsg = e => String(e?.message || e || "Terjadi kesalahan").replace(/^.*?ERROR:\s*/, "");
async function rpc(fn, args) { const {data, error} = await SB.rpc(fn, args); if (error) throw error; return data; }
async function q(p) { const {data, error} = await p; if (error) throw error; return data; }
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4800 : 2600); }
const logoSvg = (vb, cls) => `<svg class="${cls || ""}" viewBox="${vb}" aria-hidden="true"><use href="#bst"/></svg>`;
const LOGO_FULL = "0 0 2037 1753", LOGO_BST = "395 25 1200 470", LOGO_EMBLEM = "150 470 1750 1030";
const ROLE_LABEL = {owner: "Owner", manager: "Manager", kasir: "Kasir", dapur: "Dapur"};

function modal(html, wide) {
  $("#modalRoot").innerHTML = `<div class="scrim"><div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#modalRoot .scrim").addEventListener("click", e => { if (e.target.classList.contains("scrim")) closeModal(); });
  const m = $("#modalRoot .modal"); setTimeout(() => m.querySelector("input,select,textarea")?.focus(), 30); return m;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function confirmBox(title, body, ok, onOk, opts = {}) {
  const m = modal(`<h3>${esc(title)}</h3><p class="muted">${body}</p>
    ${opts.input ? `<label>${esc(opts.input)}<input id="cfIn"></label>` : ""}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="cfNo">Batal</button><button class="btn pri fit${opts.danger ? " danger" : ""}" id="cfOk">${esc(ok)}</button></div>`);
  m.querySelector("#cfNo").onclick = closeModal;
  m.querySelector("#cfOk").onclick = async () => { const v = opts.input ? m.querySelector("#cfIn").value : null; closeModal(); try { await onOk(v); } catch (e) { toast(errMsg(e), true); } };
}
async function busy(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { toast(errMsg(e), true); } finally { if (btn) btn.disabled = false; } }

/* ---------- data ---------- */
async function loadMaster() {
  const [m, i, st] = await Promise.all([
    q(SB.from("menu_items").select("*").order("sort").order("id")),
    q(SB.from("ingredients").select("*").order("name")),
    q(SB.from("settings").select("*"))
  ]);
  S.menu = m; S.ing = i; S.settings = Object.fromEntries(st.map(x => [x.key, x.value]));
}
async function loadStaff() { try { S.staff = await rpc("staff_names"); } catch (e) { S.staff = []; } }
const staffName = id => S.staff.find(s => s.id === id)?.full_name || "—";
const ingById = id => S.ing.find(i => i.id === id);
async function dayData(date) {
  const [prep, sales] = await Promise.all([
    q(SB.from("daily_prep").select("*").eq("prep_date", date)),
    q(SB.from("sales").select("*, sale_items(*)").eq("sale_date", date).order("created_at", {ascending: false}))
  ]);
  const sold = {};
  sales.filter(x => x.status === "paid").forEach(x => x.sale_items.forEach(i => sold[i.menu_item_id] = (sold[i.menu_item_id] || 0) + i.qty));
  return {prep, sales, sold};
}

/* ---------- AUTH ---------- */
async function renderAuth() {
  let has = true;
  try { const {data, error} = await SB.rpc("has_accounts"); if (!error) has = !!data; } catch (e) {}
  const last = lsGet("bst_user") || "";
  $("#root").innerHTML = `<div class="auth"><div class="auth-card">
    ${logoSvg(LOGO_FULL, "logo-full")}
    ${has ? `
    <form class="panel" id="loginForm" autocomplete="on">
      <div><div class="eyebrow">BST OS</div><h2>Masuk</h2></div>
      <label>Username<input name="username" id="lgUser" autocapitalize="none" autocomplete="username" required value="${esc(last)}"></label>
      <label>PIN 6 angka<input name="pin" id="lgPin" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="current-password" required></label>
      <button class="btn pri block" type="submit">Masuk</button>
      <p class="muted small">Belum punya akun? Minta Owner atau Manager membuatkannya di Pengaturan → Staf.</p>
    </form>` : `
    <form class="panel" id="setupForm">
      <div><div class="eyebrow">Pertama kali</div><h2>Buat akun Owner</h2></div>
      <p class="muted small">Belum ada akun di BST OS. Akun ini menjadi Owner dan bisa menambahkan staf lain.</p>
      <label>Nama<input name="name" required maxlength="40" autocomplete="name"></label>
      <label>Username<input name="username" required pattern="[a-z0-9._-]{3,24}" autocapitalize="none" placeholder="huruf kecil, mis. adi"></label>
      <label>PIN 6 angka<input name="pin" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required autocomplete="new-password"></label>
      <label>Ulangi PIN<input name="pin2" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required autocomplete="new-password"></label>
      <button class="btn pri block" type="submit">Buat akun & masuk</button>
    </form>`}
  </div></div>`;
  if (has) { if (last) $("#lgPin").focus(); }
  $("#loginForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target, u = f.username.value.trim().toLowerCase(), pin = f.pin.value;
    await busy(f.querySelector("button"), async () => {
      const {data, error} = await SB.auth.signInWithPassword({email: u + "@" + EMAIL_DOMAIN, password: pinPass(pin)});
      if (error) { f.pin.value = ""; f.pin.focus(); throw new Error(/banned/i.test(error.message) ? "Akun ini dinonaktifkan." : /rate|many/i.test(error.message) ? "Terlalu banyak percobaan. Tunggu sebentar." : "Username atau PIN salah."); }
      lsSet("bst_user", u); await start(data.session);
    });
  });
  $("#setupForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target, u = f.username.value.trim().toLowerCase(), pin = f.pin.value;
    if (pin !== f.pin2.value) return toast("PIN tidak sama.", true);
    await busy(f.querySelector("button"), async () => {
      const {data, error} = await SB.functions.invoke("admin-staff", {body: {action: "bootstrap", name: f.name.value.trim(), username: u, pin}});
      if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (x) {} throw new Error(m); }
      if (data?.error) throw new Error(data.error);
      const r = await SB.auth.signInWithPassword({email: u + "@" + EMAIL_DOMAIN, password: pinPass(pin)});
      if (r.error) throw new Error("Akun dibuat, tapi gagal masuk. Coba masuk manual.");
      lsSet("bst_user", u); await start(r.data.session);
    });
  });
}
async function callFn(name, body) {
  const {data, error} = await SB.functions.invoke(name, {body});
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (x) {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function start(session) {
  const me = await q(SB.from("profiles").select("*").eq("id", session.user.id).maybeSingle());
  if (!me || !me.active) { await SB.auth.signOut(); toast("Akun belum aktif. Hubungi Owner.", true); return renderAuth(); }
  S.me = me; S.role = me.staff_role;
  await Promise.all([loadMaster(), loadStaff()]);
  try { await rpc("open_day", {p_date: today()}); } catch (e) {}
  renderShell();
  const saved = lsGet("bst_view");
  await go(saved && VIEWS.some(v => v.k === saved && allowed(v)) ? saved : (S.role === "kasir" ? "kasir" : "beranda"));
  refreshBadges();
}
async function refreshBadges() {
  try {
    const low = S.ing.filter(i => i.active && Number(i.stock_qty) <= Number(i.min_stock) && Number(i.min_stock) > 0).length;
    const ords = await q(SB.from("orders").select("id", {count: "exact", head: false}).in("status", ["draft", "dipesan"]));
    const set = (k, n) => $$(`[data-cnt="${k}"]`).forEach(e => { e.hidden = !n; e.textContent = n; });
    set("stok", low); set("order", ords.length);
  } catch (e) {}
}

/* ================= BERANDA ================= */
async function vBeranda(el) {
  const d = today();
  const [day, att, cl, cash, orders] = await Promise.all([
    dayData(d),
    q(SB.from("attendance").select("*").eq("work_date", d).eq("user_id", S.me.id).order("at")),
    q(SB.from("checklist_runs").select("*").eq("work_date", d)),
    q(SB.from("cash_closings").select("*").eq("work_date", d).maybeSingle()),
    q(SB.from("orders").select("*").in("status", ["draft", "dipesan"]).order("created_at", {ascending: false}))
  ]);
  const lists = S.settings.checklists || {opening: [], closing: []};
  const run = k => cl.find(x => x.kind === k);
  const clDone = k => (run(k)?.done || []).length >= (lists[k] || []).length && (lists[k] || []).length > 0;
  const inDone = att.some(a => a.kind === "masuk"), outDone = att.some(a => a.kind === "pulang");
  const prepToday = day.prep.reduce((a, p) => a + p.prepared, 0);
  const prepClosed = day.prep.length > 0 && day.prep.every(p => p.closed);
  const paid = day.sales.filter(s => s.status === "paid");
  const omzet = paid.reduce((a, s) => a + Number(s.total), 0);
  const porsi = Object.values(day.sold).reduce((a, b) => a + b, 0);
  const avail = day.prep.reduce((a, p) => a + p.carry_in + p.prepared, 0) - porsi;
  const low = S.ing.filter(i => i.active && Number(i.min_stock) > 0 && Number(i.stock_qty) <= Number(i.min_stock));
  const T = [
    {t: "Absen masuk", s: inDone ? "Tercatat " + fTime(att.find(a => a.kind === "masuk").at) : "Selfie di awal shift", done: inDone, go: "absensi"},
    {t: "Checklist opening", s: `${(run("opening")?.done || []).length}/${(lists.opening || []).length} selesai`, done: clDone("opening"), go: "closing", ui: "opening"},
    {t: "Catat prep bubur", s: prepToday ? prepToday + " porsi disiapkan hari ini" : "Setiap prep memotong stok bahan", done: prepToday > 0, go: "prep"},
    ...(["owner", "manager", "kasir"].includes(S.role) ? [{t: "Buka kasir", s: paid.length ? paid.length + " transaksi · " + rp(omzet) : "Belum ada transaksi", done: paid.length > 0, go: "kasir"}] : []),
    ...(low.length ? [{t: "Order bahan yang menipis", s: low.slice(0, 3).map(i => i.name).join(", ") + (low.length > 3 ? ` +${low.length - 3}` : ""), done: false, go: "order"}] : []),
    {t: "Tutup prep: waste & sisa", s: prepClosed ? "Semua menu sudah ditutup" : "Catat yang dibuang dan disimpan", done: prepClosed, go: "prep"},
    ...(["owner", "manager", "kasir"].includes(S.role) ? [{t: "Closing kas", s: cash ? "Selisih " + rp(cash.cash_diff) : "Hitung uang laci & cek QRIS", done: !!cash, go: "closing"}] : []),
    {t: "Checklist closing", s: `${(run("closing")?.done || []).length}/${(lists.closing || []).length} selesai`, done: clDone("closing"), go: "closing", ui: "closing"},
    {t: "Absen pulang", s: outDone ? "Tercatat " + fTime(att.find(a => a.kind === "pulang").at) : "Selfie sebelum pulang", done: outDone, go: "absensi"}
  ];
  const doneN = T.filter(t => t.done).length;
  const hour = Number(new Date().toLocaleString("en-GB", {hour: "2-digit", hour12: false, timeZone: TZ}));
  const greet = hour < 11 ? "Selamat pagi" : hour < 15 ? "Selamat siang" : hour < 18 ? "Selamat sore" : "Selamat malam";
  el.innerHTML = `
    <div class="hello"><div class="stack" style="gap:.4rem">
      <div class="eyebrow" style="color:inherit;opacity:.8">${esc(fLong(d))}</div>
      <h2>${greet}, ${esc((S.me.full_name || "").split(" ")[0])}</h2>
      <p>${doneN}/${T.length} tugas hari ini selesai.${avail > 0 ? ` Bubur tersedia <b>${avail} porsi</b>.` : ""}</p>
    </div>${logoSvg(LOGO_EMBLEM)}</div>
    ${isAdmin() ? `<div class="kpis">
      <div class="kpi lead"><span class="eyebrow">Omzet hari ini</span><b>${rp(omzet)}</b><span class="small">${paid.length} transaksi</span></div>
      <div class="kpi"><span class="eyebrow">Porsi terjual</span><b>${porsi}</b><span class="small">sisa tersedia ${Math.max(avail, 0)}</span></div>
      <div class="kpi"><span class="eyebrow">Stok menipis</span><b>${low.length}</b><span class="small">${low.length ? "perlu dipesan" : "aman"}</span></div>
      <div class="kpi"><span class="eyebrow">Order berjalan</span><b>${orders.length}</b><span class="small">${orders.filter(o => o.status === "draft").length} menunggu disetujui</span></div>
    </div>` : ""}
    <div class="grid2">
      <div class="panel"><h3>Tugas hari ini</h3><div class="tasks">${T.map((t, i) => `
        <button class="task${t.done ? " done" : ""}" data-t="${i}"><span class="ck"></span><div><b>${esc(t.t)}</b><small>${esc(t.s)}</small></div><span class="go">›</span></button>`).join("")}
      </div></div>
      <div class="stack">
        ${low.length ? `<div class="panel"><h3>Stok menipis</h3><div class="tbl"><table><tbody>${low.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${num(i.stock_qty)} ${esc(i.unit)}</td><td class="num"><span class="pill ${Number(i.stock_qty) <= 0 ? "bad" : "warn"}">${Number(i.stock_qty) <= 0 ? "Habis" : "Menipis"}</span></td></tr>`).join("")}</tbody></table></div></div>` : ""}
        <div class="panel"><h3>Order bahan berjalan</h3>${orders.length ? `<div class="tbl"><table><tbody>${orders.map(o => `<tr><td>#${o.id} · ${esc(o.supplier || "Tanpa supplier")}</td><td>${(o.items || []).length} bahan</td><td class="num">${statusPill(o.status)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Tidak ada order yang sedang berjalan.</p>`}</div>
      </div>
    </div>`;
  $$("[data-t]").forEach(b => b.onclick = () => { const t = T[+b.dataset.t]; if (t.ui) S.ui.cl = t.ui; go(t.go); });
}

async function refreshKasir() {
  const d = await dayData(today());
  S.avail = {};
  S.menu.filter(m => m.active).forEach(m => { const p = d.prep.find(x => x.menu_item_id === m.id) || {carry_in: 0, prepared: 0}; S.avail[m.id] = p.carry_in + p.prepared - (d.sold[m.id] || 0); });
  $("#soldToday").textContent = Object.values(d.sold).reduce((a, b) => a + b, 0) + " porsi terjual hari ini";
  drawMenu(); drawCart();
  const paid = d.sales.filter(x => x.status === "paid");
  $("#trxSum").textContent = `${paid.length} transaksi · ${rp(paid.reduce((a, x) => a + Number(x.total), 0))}`;
  $("#trxList").innerHTML = d.sales.length ? `<table><thead><tr><th>No.</th><th>Jam</th><th>Pesanan</th><th>Bayar</th><th class="num">Total</th>${isAdmin() ? "<th></th>" : ""}</tr></thead><tbody>

function setPay(p) { S.pay = p; $("#payTunai").setAttribute("aria-pressed", p === "tunai"); $("#payQris").setAttribute("aria-pressed", p === "qris"); $("#cashBox").hidden = p !== "tunai"; }

async function shrink(file, max) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", .82));
}

  const cats = [...new Set(S.ing.map(i => i.category || "Bahan"))];
  const low = S.ing.filter(i => i.active && Number(i.min_stock) > 0 && Number(i.stock_qty) <= Number(i.min_stock));
  const value = S.ing.reduce((a, i) => a + Math.max(0, Number(i.stock_qty)) * Number(i.cost_per_unit), 0);
  el.innerHTML = `<div class="head"><div><div class="eyebrow">Gudang</div><h2>Stok bahan baku</h2></div>
    <div class="row" style="flex:1 1 auto;justify-content:flex-end"><button class="btn fit" id="wasteBtn" ${S.ing.length ? "" : "disabled"}>Catat waste bahan</button>${low.length ? `<button class="btn pri fit" id="toOrder">Order ${low.length} bahan menipis</button>` : ""}</div></div>
    ${isAdmin() ? `<div class="kpis"><div class="kpi"><span class="eyebrow">Nilai stok</span><b>${rp(value)}</b></div><div class="kpi"><span class="eyebrow">Jumlah bahan</span><b>${S.ing.filter(i => i.active).length}</b></div><div class="kpi"><span class="eyebrow">Menipis / habis</span><b>${low.length}</b></div></div>` : ""}
    <div class="panel tbl">${S.ing.length ? `<table><thead><tr><th>Bahan</th><th class="num">Stok</th><th class="num">Min</th><th class="num">Par</th>${isAdmin() ? `<th class="num">HPP/satuan</th><th class="num">Nilai</th>` : ""}<th>Status</th>${isAdmin() ? "<th></th>" : ""}</tr></thead><tbody>
      ${cats.map(c => `<tr><td colspan="9" class="eyebrow" style="padding-top:1rem">${esc(c)}</td></tr>` + S.ing.filter(i => (i.category || "Bahan") === c).map(i => { const n = Number(i.stock_qty), mn = Number(i.min_stock);
        const st = n <= 0 ? ["bad", "Habis"] : mn > 0 && n <= mn ? ["warn", "Menipis"] : ["ok", "Aman"];
        return `<tr><td><b>${esc(i.name)}</b><div class="muted small">${esc(i.supplier || "")}</div></td><td class="num">${num(n)} ${esc(i.unit)}</td><td class="num">${num(mn)}</td><td class="num">${num(i.par_stock)}</td>
          ${isAdmin() ? `<td class="num">${rp(i.cost_per_unit)}${Number(i.cost_per_unit) < 10 && Number(i.cost_per_unit) > 0 ? `<div class="muted small">${num(i.cost_per_unit, 2)}</div>` : ""}</td><td class="num">${rp(Math.max(0, n) * i.cost_per_unit)}</td>` : ""}
          <td><span class="pill ${st[0]}">${st[1]}</span></td>${isAdmin() ? `<td class="num"><button class="btn ghost sm" data-opn="${i.id}">Opname</button></td>` : ""}</tr>`; }).join("")).join("")}
    </tbody></table>` : `<div class="empty">${logoSvg(LOGO_EMBLEM, "emb")}<b>Belum ada bahan baku</b><span>Owner bisa menambahkannya di Pengaturan → Bahan baku, lalu isi resep dari COGS.</span></div>`}</div>
    <div class="panel"><h3>Pergerakan stok terakhir</h3><div class="tbl" id="moves"><p class="muted">Memuat…</p></div></div>`;
  $("#toOrder")?.addEventListener("click", () => { S.ui.suggest = true; go("order"); });
  $("#wasteBtn").onclick = () => {
    const m = modal(`<h3>Catat waste bahan</h3><p class="muted small">Untuk bahan yang rusak, tumpah, atau kedaluwarsa. Stok langsung berkurang.</p>
      <label>Bahan<select id="wsI">${S.ing.filter(i => i.active).map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.unit)})</option>`).join("")}</select></label>
      <label>Jumlah<input id="wsQ" inputmode="decimal"></label><label>Alasan<input id="wsR" placeholder="mis. basi, tumpah"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="wsNo">Batal</button><button class="btn pri fit" id="wsOk">Simpan</button></div>`);
    m.querySelector("#wsNo").onclick = closeModal;
    m.querySelector("#wsOk").onclick = e => busy(e.target, async () => { await rpc("record_waste", {p_ingredient: +m.querySelector("#wsI").value, p_qty: pd(m.querySelector("#wsQ").value), p_reason: m.querySelector("#wsR").value}); closeModal(); toast("Waste dicatat."); vStok(el); });
  };
  $$("[data-opn]").forEach(b => b.onclick = () => { const i = ingById(+b.dataset.opn);
    const m = modal(`<h3>Stock opname · ${esc(i.name)}</h3><p class="muted">Stok di sistem <b>${num(i.stock_qty)} ${esc(i.unit)}</b>. Isi hasil hitung fisik.</p>
      <label>Stok fisik (${esc(i.unit)})<input id="opQ" inputmode="decimal"></label><label>Catatan<input id="opN" placeholder="Opname mingguan"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="opNo">Batal</button><button class="btn pri fit" id="opOk">Simpan</button></div>`);
    m.querySelector("#opNo").onclick = closeModal;
    m.querySelector("#opOk").onclick = e => { const v = m.querySelector("#opQ").value; if (v === "") return; busy(e.target, async () => { await rpc("adjust_stock", {p_ingredient: i.id, p_new_qty: pd(v), p_note: m.querySelector("#opN").value || null}); closeModal(); toast("Stok diperbarui."); vStok(el); }); };
  });
  const mv = await q(SB.from("stock_movements").select("*").order("created_at", {ascending: false}).limit(80));
  const lab = x => x.type === "purchase" ? ["ok", "Masuk"] : x.type === "prep" ? ["ink", "Prep"] : x.adj_kind === "waste" ? ["bad", "Waste"] : ["idle", "Opname"];
  $("#moves").innerHTML = mv.length ? `<table><thead><tr><th>Waktu</th><th>Bahan</th><th>Jenis</th><th class="num">Perubahan</th><th>Keterangan</th></tr></thead><tbody>
    ${mv.map(x => { const i = ingById(x.ingredient_id), l = lab(x); return `<tr><td class="small">${fDT(x.created_at)}</td><td>${esc(i?.name)}</td><td><span class="pill ${l[0]}">${l[1]}</span></td>
      <td class="num" style="color:${x.qty_change < 0 ? "var(--bad)" : "var(--ok)"}">${x.qty_change > 0 ? "+" : ""}${num(x.qty_change)} ${esc(i?.unit)}</td><td class="muted small">${esc(x.note)}${x.created_by ? " · " + esc(staffName(x.created_by)) : ""}</td></tr>`; }).join("")}</tbody></table>` : `<p class="muted">Belum ada pergerakan stok.</p>`;
}

/* ================= ORDER BAHAN ================= */
const statusPill = s => `<span class="pill ${{draft: "warn", dipesan: "ink", diterima: "ok", batal: "idle"}[s]}">${{draft: "Menunggu disetujui", dipesan: "Sudah dipesan", diterima: "Diterima", batal: "Batal"}[s]}</span>`;
async function vOrder(el) {
  await loadMaster();
  const orders = await q(SB.from("orders").select("*").order("created_at", {ascending: false}).limit(40));
  const low = S.ing.filter(i => i.active && Number(i.min_stock) > 0 && Number(i.stock_qty) <= Number(i.min_stock));
  el.innerHTML = `<div class="head"><div><div class="eyebrow">Gudang</div><h2>Order bahan</h2></div><button class="btn pri fit" id="newOrder" ${S.ing.length ? "" : "disabled"}>Buat order</button></div>
    <p class="muted" style="max-width:70ch">Alur: <b class="ink">buat order → disetujui & dipesan (Owner/Manager) → terima barang</b>. Saat barang diterima, harga asli dicatat sebagai pembelian dan stok bertambah otomatis.</p>
    ${low.length ? `<div class="panel ink-b"><div class="head" style="margin-bottom:.5rem"><h3 style="margin:0">Saran order · ${low.length} bahan di bawah minimum</h3><button class="btn sm fit" id="useSuggest">Buat order dari saran</button></div>
      <div class="tbl"><table><thead><tr><th>Bahan</th><th class="num">Stok</th><th class="num">Par</th><th class="num">Saran pesan</th><th>Supplier</th></tr></thead><tbody>
      ${low.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${num(i.stock_qty)} ${esc(i.unit)}</td><td class="num">${num(i.par_stock)}</td><td class="num"><b>${num(suggestQty(i))} ${esc(i.unit)}</b></td><td>${esc(i.supplier || "—")}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    <div class="stack" id="orderList">${orders.length ? orders.map(orderCard).join("") : `<div class="empty">${logoSvg(LOGO_EMBLEM, "emb")}<b>Belum ada order</b><span>Order dibuat dari saran stok menipis atau manual dengan tombol Buat order.</span></div>`}</div>`;
  $("#newOrder").onclick = () => orderForm(el, null, []);
  $("#useSuggest")?.addEventListener("click", () => openSuggest(el, low));
  if (S.ui.suggest && low.length) { S.ui.suggest = false; openSuggest(el, low); }
  $$("[data-oact]").forEach(b => b.onclick = () => orderAction(el, orders.find(o => o.id === +b.dataset.oid), b.dataset.oact, b));
}
const suggestQty = i => Math.max(Number(i.par_stock) - Number(i.stock_qty), Number(i.min_stock) - Number(i.stock_qty), 0) || Number(i.min_stock) || 1;
function openSuggest(el, low) {
  const bySup = {}; low.forEach(i => (bySup[i.supplier || ""] ||= []).push(i));
  const sups = Object.keys(bySup);
  if (sups.length === 1) return orderForm(el, null, low.map(i => ({ingredient_id: i.id, qty: suggestQty(i), est_price: Number(i.cost_per_unit)})), sups[0]);
  const m = modal(`<h3>Pilih supplier</h3><p class="muted">Bahan menipis berasal dari beberapa supplier. Satu order per supplier.</p>
    <div class="stack">${sups.map(s => `<button class="btn ghost block" data-sup="${esc(s)}">${esc(s || "Tanpa supplier")} · ${bySup[s].length} bahan</button>`).join("")}</div>`);
  m.querySelectorAll("[data-sup]").forEach(b => b.onclick = () => { const s = b.dataset.sup; orderForm(el, null, bySup[s].map(i => ({ingredient_id: i.id, qty: suggestQty(i), est_price: Number(i.cost_per_unit)})), s); });
}
function orderCard(o) {
  const items = o.items || [], est = items.reduce((a, it) => a + Number(it.qty) * Number(it.est_price || 0), 0);
  const acts = [];
  if (o.status === "draft") { acts.push(["edit", "Ubah", "ghost"]); if (isAdmin()) acts.push(["place", "Setujui & pesan", "pri"]); acts.push(["cancel", "Batalkan", "danger"]); }
  if (o.status === "dipesan") { acts.push(["wa", "Salin pesan WA", "ghost"]); acts.push(["recv", "Terima barang", "pri"]); if (isAdmin()) acts.push(["cancel", "Batalkan", "danger"]); }
  if (o.status === "draft") acts.unshift(["wa", "Salin pesan WA", "ghost"]);
  return `<div class="panel stack" style="gap:.6rem">
    <div class="head"><div><h3 style="margin:0">Order #${o.id} · ${esc(o.supplier || "Tanpa supplier")}</h3><span class="muted small">Dibuat ${fDT(o.created_at)} oleh ${esc(staffName(o.created_by))}${o.eta ? " · datang " + fDate(o.eta) : ""}</span></div>${statusPill(o.status)}</div>
    <div class="tbl"><table><tbody>${items.map(it => { const i = ingById(it.ingredient_id); return `<tr><td>${esc(i?.name || "?")}</td><td class="num">${num(it.qty)} ${esc(i?.unit || "")}</td>${isAdmin() ? `<td class="num muted">≈ ${rp(Number(it.qty) * Number(it.est_price || 0))}</td>` : ""}</tr>`; }).join("")}</tbody></table></div>
    ${o.note ? `<p class="muted small">Catatan: ${esc(o.note)}</p>` : ""}
    <div class="row" style="justify-content:space-between">${isAdmin() ? `<span class="muted small fit">Perkiraan ${rp(est)}</span>` : "<span></span>"}<div class="row" style="flex:1 1 auto;justify-content:flex-end">${acts.map(a => `<button class="btn sm ${a[2]} fit" data-oact="${a[0]}" data-oid="${o.id}">${a[1]}</button>`).join("")}</div></div>
  </div>`;
}
function orderForm(el, o, items, sup) {
  let lines = (o?.items || items || []).map(x => ({...x})); if (!lines.length) lines = [{ingredient_id: "", qty: "", est_price: 0}];
  const opts = S.ing.filter(i => i.active).map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.unit)})</option>`).join("");
  const m = modal(`<h3>${o ? "Ubah order #" + o.id : "Order baru"}</h3>
    <div class="row"><label>Supplier<input id="ofS" value="${esc(o?.supplier ?? sup ?? "")}" placeholder="Pasar Terong"></label><label>Perkiraan datang<input type="date" id="ofE" value="${o?.eta || addDays(today(), 1)}"></label></div>
    <div id="ofL" class="stack" style="gap:.5rem"></div><button class="btn ghost sm fit" id="ofAdd" style="justify-self:start">+ Tambah bahan</button>
    <label>Catatan<input id="ofN" value="${esc(o?.note || "")}"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="ofNo">Batal</button><button class="btn pri fit" id="ofOk">Simpan order</button></div>`, true);
  const draw = () => { m.querySelector("#ofL").innerHTML = lines.map((l, i) => `<div class="row"><label>Bahan<select data-l="${i}" data-k="ingredient_id"><option value="">Pilih</option>${opts}</select></label><label style="flex:0 1 130px">Jumlah<input data-l="${i}" data-k="qty" inputmode="decimal" value="${esc(l.qty)}"></label><button class="btn danger sm fit" data-rm="${i}" aria-label="Hapus">×</button></div>`).join("");
    m.querySelectorAll("select[data-l]").forEach(s => s.value = lines[s.dataset.l].ingredient_id);
    m.querySelectorAll("[data-l]").forEach(x => x.oninput = x.onchange = () => { lines[x.dataset.l][x.dataset.k] = x.value; if (x.dataset.k === "ingredient_id") lines[x.dataset.l].est_price = Number(ingById(+x.value)?.cost_per_unit || 0); });
    m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { lines.splice(+b.dataset.rm, 1); if (!lines.length) lines.push({ingredient_id: "", qty: ""}); draw(); }); };
  draw();
  m.querySelector("#ofAdd").onclick = () => { lines.push({ingredient_id: "", qty: ""}); draw(); };
  m.querySelector("#ofNo").onclick = closeModal;
  m.querySelector("#ofOk").onclick = e => { const its = lines.filter(l => l.ingredient_id && pd(l.qty) > 0).map(l => ({ingredient_id: +l.ingredient_id, qty: pd(l.qty), est_price: Number(l.est_price || ingById(+l.ingredient_id)?.cost_per_unit || 0)}));
    if (!its.length) return toast("Isi minimal satu bahan dan jumlahnya.", true);
    busy(e.target, async () => { const row = {supplier: m.querySelector("#ofS").value.trim() || null, eta: m.querySelector("#ofE").value || null, note: m.querySelector("#ofN").value || null, items: its};
      if (o) await q(SB.from("orders").update(row).eq("id", o.id)); else await q(SB.from("orders").insert(row));
      closeModal(); toast(o ? "Order diperbarui." : "Order dibuat."); vOrder(el); refreshBadges(); }); };
}
function waText(o) {
  const lines = (o.items || []).map(it => { const i = ingById(it.ingredient_id); return `- ${i?.name}: ${num(it.qty)} ${i?.unit}`; }).join("\n");
  return `Halo${o.supplier ? " " + o.supplier : ""}, kami dari ${S.settings.outlet?.name || "Bubur Simpang Tiga"} mau pesan:\n${lines}\n${o.eta ? "Untuk diantar " + fLong(o.eta) + ".\n" : ""}Terima kasih.`;
}
async function orderAction(el, o, act, btn) {
  if (act === "edit") return orderForm(el, o);
  if (act === "wa") { const t = waText(o); try { await navigator.clipboard.writeText(t); toast("Pesan disalin. Tempel di WhatsApp supplier."); } catch (e) { const m = modal(`<h3>Pesan untuk supplier</h3><textarea rows="8" id="waT">${esc(t)}</textarea><button class="btn pri" id="waOk">Tutup</button>`); m.querySelector("#waT").select(); m.querySelector("#waOk").onclick = closeModal; } return; }
  if (act === "place") return busy(btn, async () => { await q(SB.from("orders").update({status: "dipesan", ordered_at: new Date().toISOString()}).eq("id", o.id)); toast("Order disetujui. Salin pesan WA untuk dikirim ke supplier."); vOrder(el); });
  if (act === "cancel") return confirmBox("Batalkan order?", `Order #${o.id} ditandai batal.`, "Batalkan order", async () => { await q(SB.from("orders").update({status: "batal"}).eq("id", o.id)); toast("Order dibatalkan."); vOrder(el); refreshBadges(); }, {danger: true});
  if (act === "recv") {
    const lines = (o.items || []).map(it => ({...it, total: Math.round(Number(it.qty) * Number(it.est_price || 0)) || ""}));
    const m = modal(`<h3>Terima barang · order #${o.id}</h3><p class="muted small">Sesuaikan jumlah yang benar-benar datang dan total harga di nota.</p>
      <div class="stack" style="gap:.5rem">${lines.map((l, i) => { const g = ingById(l.ingredient_id); return `<div class="row"><div style="flex:1 1 140px"><b>${esc(g?.name)}</b><div class="muted small">${esc(g?.unit)}</div></div><label style="flex:0 1 120px">Datang<input data-r="${i}" data-k="qty" inputmode="decimal" value="${num(l.qty, 3)}"></label><label style="flex:0 1 150px">Total harga (Rp)<input data-r="${i}" data-k="total" inputmode="numeric" value="${l.total ? Number(l.total).toLocaleString("id-ID") : ""}"></label></div>`; }).join("")}</div>
      <div class="seg" role="group"><button id="rvPaid" aria-pressed="true">Lunas</button><button id="rvDebt" aria-pressed="false">Bayar nanti (utang)</button></div>
      <label id="rvDueW" hidden>Jatuh tempo<input type="date" id="rvDue" value="${addDays(today(), 7)}"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="rvNo">Batal</button><button class="btn pri fit" id="rvOk">Simpan penerimaan</button></div>`, true);
    let paid = true;
    m.querySelector("#rvPaid").onclick = () => { paid = true; m.querySelector("#rvPaid").setAttribute("aria-pressed", true); m.querySelector("#rvDebt").setAttribute("aria-pressed", false); m.querySelector("#rvDueW").hidden = true; };
    m.querySelector("#rvDebt").onclick = () => { paid = false; m.querySelector("#rvPaid").setAttribute("aria-pressed", false); m.querySelector("#rvDebt").setAttribute("aria-pressed", true); m.querySelector("#rvDueW").hidden = false; };
    m.querySelectorAll("[data-r]").forEach(x => x.oninput = () => lines[x.dataset.r][x.dataset.k] = x.value);
    m.querySelector("#rvNo").onclick = closeModal;
    m.querySelector("#rvOk").onclick = e => { const its = lines.filter(l => pd(l.qty) > 0).map(l => { const n = pd(l.qty); return {ingredient_id: l.ingredient_id, qty: n, unit_price: pn(l.total) / n}; });
      if (!its.length) return toast("Tidak ada barang yang diterima.", true);
      busy(e.target, async () => { await rpc("receive_order", {p_order: o.id, p_items: its, p_paid: paid, p_due: paid ? null : m.querySelector("#rvDue").value}); closeModal(); toast("Barang diterima, stok bertambah."); await loadMaster(); vOrder(el); refreshBadges(); }); };
  }
}

/* ================= PEMBELIAN ================= */
async function vPembelian(el) {
  await loadMaster();
  if (!S.buy.length) S.buy = [{ing: "", qty: "", total: ""}];
  const list = await q(SB.from("purchases").select("*, purchase_items(*)").order("purchase_date", {ascending: false}).order("id", {ascending: false}).limit(40));
  el.innerHTML = `<div class="head"><div><div class="eyebrow">Gudang</div><h2>Pembelian bahan</h2></div></div>
    <p class="muted" style="max-width:70ch">Untuk belanja langsung tanpa order (mis. beli di pasar pagi ini). Harga pokok bahan diperbarui otomatis memakai rata-rata.</p>
    <div class="panel ink-b stack">
      <div class="row"><label>Tanggal<input type="date" id="bD" value="${today()}"></label><label>Supplier / tempat beli<input id="bS" placeholder="Pasar Terong"></label><label>Catatan<input id="bN"></label></div>
      <div id="bL" class="stack" style="gap:.5rem"></div>
      <div class="row" style="justify-content:space-between"><button class="btn ghost sm fit" id="bAdd">+ Tambah bahan</button>
        <div class="seg fit" style="flex:0 0 auto"><button id="bPaid" aria-pressed="true">Lunas</button><button id="bDebt" aria-pressed="false">Utang</button></div>
        <label id="bDueW" class="fit" hidden>Jatuh tempo<input type="date" id="bDue" value="${addDays(today(), 7)}"></label>
        <div class="fit" style="text-align:right"><span class="muted">Total </span><b id="bT" class="serif ink" style="font-size:1.3rem">Rp0</b></div>
        <button class="btn pri fit" id="bSave">Simpan pembelian</button></div>
    </div>
    <div class="panel"><h3>Pembelian terakhir</h3>${list.length ? `<div class="tbl"><table><thead><tr><th>Tanggal</th><th>Supplier</th><th>Item</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>
      ${list.map(p => `<tr><td>${fDate(p.purchase_date)}</td><td>${esc(p.supplier || "—")}</td><td class="small">${p.purchase_items.map(it => { const i = ingById(it.ingredient_id); return `${esc(i?.name)} ${num(it.qty)} ${esc(i?.unit)}`; }).join(", ")}</td><td class="num">${rp(p.total)}</td>
        <td>${p.paid ? `<span class="pill ok">Lunas</span>` : `<span class="pill warn">Utang${p.due_date ? " · " + fDate(p.due_date) : ""}</span>${isAdmin() ? ` <button class="btn sm ghost" data-pay="${p.id}">Tandai lunas</button>` : ""}`}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="muted">Belum ada pembelian tercatat.</p>`}</div>`;
  let paid = true;
  $("#bPaid").onclick = () => { paid = true; $("#bPaid").setAttribute("aria-pressed", true); $("#bDebt").setAttribute("aria-pressed", false); $("#bDueW").hidden = true; };
  $("#bDebt").onclick = () => { paid = false; $("#bPaid").setAttribute("aria-pressed", false); $("#bDebt").setAttribute("aria-pressed", true); $("#bDueW").hidden = false; };
  const opts = S.ing.filter(i => i.active).map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.unit)})</option>`).join("");
  const tot = () => $("#bT").textContent = rp(S.buy.reduce((a, l) => a + pn(l.total), 0));
  const draw = () => {
    if (!opts) { $("#bL").innerHTML = `<div class="empty">Tambahkan bahan baku dulu di Pengaturan.</div>`; return; }

/* ================= RANGE PICKER ================= */
function rangeOf(p) {
  const t = today(); let s = t, e = t;
  if (p === "7") s = addDays(t, -6); if (p === "30") s = addDays(t, -29);
  if (p === "month") s = t.slice(0, 8) + "01";
  if (p === "lastmonth") { e = addDays(t.slice(0, 8) + "01", -1); s = e.slice(0, 8) + "01"; }
  return [s, e];
}
function rangeBar(key, onChange) {
  const r = S.ui[key] ||= {p: "month", s: rangeOf("month")[0], e: rangeOf("month")[1]};
  const html = `<div class="row" style="flex:0 1 560px"><select id="${key}P">${[["today", "Hari ini"], ["7", "7 hari terakhir"], ["30", "30 hari terakhir"], ["month", "Bulan ini"], ["lastmonth", "Bulan lalu"], ["custom", "Pilih tanggal"]].map(([v, l]) => `<option value="${v}" ${r.p === v ? "selected" : ""}>${l}</option>`).join("")}</select><input type="date" id="${key}S" value="${r.s}"><input type="date" id="${key}E" value="${r.e}"></div>`;
  const bind = () => {
    $(`#${key}P`).onchange = e => { r.p = e.target.value; if (r.p !== "custom") [r.s, r.e] = rangeOf(r.p); onChange(); };
    $(`#${key}S`).onchange = e => { r.p = "custom"; r.s = e.target.value; onChange(); };
    $(`#${key}E`).onchange = e => { r.p = "custom"; r.e = e.target.value; onChange(); };
  };
  return {html, bind, r};
}
function daysBetween(s, e) { const out = []; for (let d = s; d <= e && out.length < 92; d = addDays(d, 1)) out.push(d); return out; }

  async menu(box, re) {
    box.innerHTML = `<div class="panel stack"><div class="tbl"><table><thead><tr><th>Menu</th><th class="num">Harga</th><th class="num">HPP/porsi</th><th>Aktif</th><th></th></tr></thead><tbody>
      ${S.menu.map(m => `<tr><td><input data-mn="${m.id}" value="${esc(m.name)}"></td><td><input data-mp="${m.id}" inputmode="numeric" value="${num(m.price, 0)}" style="max-width:120px;text-align:right"></td><td class="num" id="hpp-${m.id}">…</td>
        <td><input type="checkbox" data-ma="${m.id}" ${m.active ? "checked" : ""} style="width:auto"></td><td><button class="btn sm" data-ms="${m.id}">Simpan</button></td></tr>`).join("")}</tbody></table></div>
      <div class="row"><label>Menu baru<input id="nmN" placeholder="mis. Bubur Spesial"></label><label style="flex:0 1 160px">Harga<input id="nmP" inputmode="numeric" placeholder="32.000"></label><button class="btn pri" id="nmAdd">Tambah menu</button></div></div>`;
    S.menu.forEach(async m => { try { const c = await rpc("portion_cost", {p_menu: m.id}); $("#hpp-" + m.id).innerHTML = `${rp(c)} <span class="muted small">${m.price ? Math.round(c / m.price * 100) : 0}%</span>`; } catch (e) {} });
    $$("[data-ms]").forEach(b => b.onclick = () => { const id = +b.dataset.ms; busy(b, async () => { await q(SB.from("menu_items").update({name: $(`[data-mn="${id}"]`).value.trim(), price: pn($(`[data-mp="${id}"]`).value), active: $(`[data-ma="${id}"]`).checked}).eq("id", id)); toast("Menu disimpan."); re(); }); });
    $("#nmAdd").onclick = e => { const n = $("#nmN").value.trim(), p = pn($("#nmP").value); if (!n || !p) return toast("Isi nama dan harga menu.", true);
      busy(e.target, async () => { await q(SB.from("menu_items").insert({name: n, price: p, sort: S.menu.length + 1})); toast("Menu ditambahkan."); re(); }); };
  },
  async bahan(box, re) {
    box.innerHTML = `<div class="panel stack"><p class="muted small">HPP/satuan terisi otomatis dari pembelian (rata-rata). <b>Min</b> = batas stok menipis, <b>Par</b> = jumlah ideal setelah belanja (dipakai untuk saran order).</p>
      <div class="tbl">${S.ing.length ? `<table><thead><tr><th>Bahan</th><th>Kategori</th><th>Satuan</th><th class="num">HPP/satuan</th><th class="num">Min</th><th class="num">Par</th><th>Supplier</th><th>Aktif</th><th></th></tr></thead><tbody>
        ${S.ing.map(i => `<tr><td><input data-f="name" data-id="${i.id}" value="${esc(i.name)}" style="min-width:140px"></td><td><input data-f="category" data-id="${i.id}" value="${esc(i.category || "Bahan")}" style="width:110px"></td><td><input data-f="unit" data-id="${i.id}" value="${esc(i.unit)}" style="width:80px"></td>
          <td><input data-f="cost_per_unit" data-id="${i.id}" inputmode="decimal" value="${Number(i.cost_per_unit)}" style="width:100px;text-align:right"></td><td><input data-f="min_stock" data-id="${i.id}" inputmode="decimal" value="${Number(i.min_stock)}" style="width:90px;text-align:right"></td>
          <td><input data-f="par_stock" data-id="${i.id}" inputmode="decimal" value="${Number(i.par_stock)}" style="width:90px;text-align:right"></td><td><input data-f="supplier" data-id="${i.id}" value="${esc(i.supplier || "")}" style="width:130px"></td>
          <td><input type="checkbox" data-f="active" data-id="${i.id}" ${i.active ? "checked" : ""} style="width:auto"></td><td><button class="btn sm" data-is="${i.id}">Simpan</button></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Belum ada bahan. Tambahkan dari daftar COGS di bawah.</div>`}</div>
      <div class="rule"></div><h3 style="margin:0">Tambah bahan</h3>
      <div class="row"><label>Nama<input id="niN" placeholder="Beras"></label><label style="flex:0 1 130px">Kategori<input id="niC" placeholder="Bahan" list="cats"></label><label style="flex:0 1 110px">Satuan<input id="niU" placeholder="gram"></label>
        <label style="flex:0 1 130px">HPP/satuan<input id="niH" inputmode="decimal" placeholder="15"></label><label style="flex:0 1 110px">Min<input id="niM" inputmode="decimal"></label><label style="flex:0 1 110px">Par<input id="niP" inputmode="decimal"></label><label style="flex:0 1 150px">Supplier<input id="niS"></label><button class="btn pri" id="niAdd">Tambah</button></div>
      <datalist id="cats">${["Bahan", "Topping", "Bumbu", "Kemasan", "Gas & lainnya"].map(c => `<option value="${c}">`).join("")}</datalist></div>`;
    $$("[data-is]").forEach(b => b.onclick = () => { const id = b.dataset.is, g = f => $(`[data-f="${f}"][data-id="${id}"]`);
      busy(b, async () => { await q(SB.from("ingredients").update({name: g("name").value.trim(), category: g("category").value.trim() || "Bahan", unit: g("unit").value.trim(), cost_per_unit: pd(g("cost_per_unit").value), min_stock: pd(g("min_stock").value), par_stock: pd(g("par_stock").value), supplier: g("supplier").value.trim() || null, active: g("active").checked}).eq("id", +id)); toast("Bahan disimpan."); re(); }); });
    $("#niAdd").onclick = e => { const n = $("#niN").value.trim(), u = $("#niU").value.trim(); if (!n || !u) return toast("Isi nama dan satuan bahan.", true);
      busy(e.target, async () => { const {error} = await SB.from("ingredients").insert({name: n, unit: u, category: $("#niC").value.trim() || "Bahan", cost_per_unit: pd($("#niH").value), min_stock: pd($("#niM").value), par_stock: pd($("#niP").value), supplier: $("#niS").value.trim() || null});
        if (error) throw new Error(error.code === "23505" ? "Bahan dengan nama itu sudah ada." : error.message); toast("Bahan ditambahkan."); re(); }); };
  },
  async resep(box, re) {
    const mid = +(S.ui.recipeMenu || S.menu[0]?.id);
    box.innerHTML = `<div class="panel stack"><div class="row"><label style="flex:0 1 280px">Menu<select id="rcM">${S.menu.map(m => `<option value="${m.id}" ${m.id === mid ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label></div>
      <div class="tbl" id="rcT"></div><div class="rule"></div>
      <div class="row"><label>Bahan<select id="rcI">${S.ing.filter(i => i.active).map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.unit)})</option>`).join("") || `<option value="">Tambah bahan dulu</option>`}</select></label><label style="flex:0 1 170px">Takaran per porsi<input id="rcQ" inputmode="decimal"></label><button class="btn pri" id="rcAdd">Tambah ke resep</button></div>
      <p class="muted small">Takaran memakai satuan bahan. Contoh: beras 80 gram per porsi, telur 0,5 butir per porsi.</p></div>`;
    $("#rcM").onchange = e => { S.ui.recipeMenu = e.target.value; re(); };
    const lines = await q(SB.from("recipe_lines").select("*").eq("menu_item_id", mid));
    const price = Number(S.menu.find(m => m.id === mid)?.price || 0); let tot = 0;
    const rows = lines.map(r => { const i = ingById(r.ingredient_id), c = r.qty_per_portion * (i?.cost_per_unit || 0); tot += c; return `<tr><td>${esc(i?.name)}</td><td class="num">${num(r.qty_per_portion, 4)} ${esc(i?.unit)}</td><td class="num">${rp(c)}</td><td class="num"><button class="btn danger sm" data-rd="${r.id}" aria-label="Hapus">×</button></td></tr>`; }).join("");
    const tgt = Number(S.settings.targets?.food_cost || 35), fc = price ? tot / price * 100 : 0;
    $("#rcT").innerHTML = rows ? `<table><thead><tr><th>Bahan</th><th class="num">Per porsi</th><th class="num">Biaya</th><th></th></tr></thead><tbody>${rows}
      <tr><td><b>HPP per porsi</b></td><td></td><td class="num"><b>${rp(tot)}</b></td><td class="num"><span class="pill ${fc <= tgt ? "ok" : "bad"}">${fc.toFixed(1)}%</span></td></tr></tbody></table>`
      : `<div class="empty">Resep menu ini belum diisi. Tambahkan bahan dan takaran per porsi sesuai COGS.</div>`;
    $$("[data-rd]").forEach(b => b.onclick = () => busy(b, async () => { await q(SB.from("recipe_lines").delete().eq("id", +b.dataset.rd)); re(); }));
    $("#rcAdd").onclick = e => { const n = pd($("#rcQ").value); if (!(n > 0) || !$("#rcI").value) return toast("Pilih bahan dan isi takaran.", true);
      busy(e.target, async () => { await q(SB.from("recipe_lines").upsert({menu_item_id: mid, ingredient_id: +$("#rcI").value, qty_per_portion: n}, {onConflict: "menu_item_id,ingredient_id"})); re(); }); };
  },
  async staf(box, re) {
    const list = await q(SB.from("profiles").select("*").order("created_at"));
    box.innerHTML = `<div class="panel stack"><div class="head"><h3 style="margin:0">Staf</h3><button class="btn pri fit" id="sfNew">Tambah staf</button></div>
      <div class="tbl"><table><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(u => `<tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.username || "")}</td><td>${esc(ROLE_LABEL[u.staff_role] || u.staff_role)}</td><td><span class="pill ${u.active ? "ok" : "idle"}">${u.active ? "Aktif" : "Nonaktif"}</span></td><td class="num"><button class="btn ghost sm" data-sf="${u.id}">Ubah</button></td></tr>`).join("")}</tbody></table></div>
      <div class="panel" style="background:var(--paper)"><b>Akses per peran</b><ul class="small muted" style="margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:.2rem">
        <li><b>Owner / Manager</b>: semua menu, termasuk keuangan, analitik, pengaturan, opname, dan pembatalan transaksi.</li>
        <li><b>Kasir</b>: kasir, prep, closing kas & checklist, absensi, stok, order bahan.</li>
        <li><b>Dapur</b>: prep, checklist, absensi, stok & waste, order dan pembelian bahan.</li></ul></div></div>`;
    const form = u => { const m = modal(`<h3>${u ? "Ubah staf" : "Tambah staf"}</h3>
      <label>Nama<input id="sN" value="${esc(u?.full_name || "")}" maxlength="40"></label>
      <label>Username<input id="sU" value="${esc(u?.username || "")}" autocapitalize="none" placeholder="huruf kecil, mis. rina"></label>
      <label>Peran<select id="sR">${["kasir", "dapur", "manager", "owner"].filter(r => r !== "owner" || S.role === "owner").map(r => `<option value="${r}" ${u?.staff_role === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select></label>
      <label>${u ? "PIN baru (kosongkan bila tidak diganti)" : "PIN 6 angka"}<input id="sP" class="pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      ${u ? `<label style="display:flex;gap:.5rem;align-items:center;color:var(--text)"><input type="checkbox" id="sA" ${u.active ? "checked" : ""} style="width:auto"> Akun aktif</label>` : ""}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="sNo">Batal</button><button class="btn pri fit" id="sOk">Simpan</button></div>`);
      m.querySelector("#sNo").onclick = closeModal;
      m.querySelector("#sOk").onclick = e => busy(e.target, async () => { const pin = m.querySelector("#sP").value.trim();
        await callFn("admin-staff", {action: "save", id: u?.id || "", name: m.querySelector("#sN").value.trim(), username: m.querySelector("#sU").value.trim().toLowerCase(), role: m.querySelector("#sR").value, pin, active: u ? m.querySelector("#sA").checked : true});
        closeModal(); toast("Data staf tersimpan." + (pin ? " Beri tahu PIN-nya langsung ke staf." : "")); await loadStaff(); re(); }); };
    $("#sfNew").onclick = () => form(null);
    $$("[data-sf]").forEach(b => b.onclick = () => form(list.find(u => u.id === b.dataset.sf)));
  },
  async cadangan(box) {
    box.innerHTML = `<div class="panel stack"><h3 style="margin:0">Unduh cadangan data</h3><p class="muted">Simpan salinan semua data (menu, bahan, resep, penjualan, prep, stok, pembelian, order, closing, absensi, biaya) sebagai file JSON. Lakukan seminggu sekali; paket gratis Supabase tidak menyimpan riwayat pemulihan.</p>
      <button class="btn pri fit" id="bk" style="justify-self:start">Unduh cadangan</button><p class="muted small">Jangan unggah file cadangan ke GitHub karena repo ini publik.</p></div>`;
    $("#bk").onclick = e => busy(e.target, async () => {
      const T = ["settings", "menu_items", "ingredients", "recipe_lines", "daily_prep", "sales", "sale_items", "purchases", "purchase_items", "stock_movements", "orders", "cash_closings", "checklist_runs", "attendance", "expenses"], out = {};
      for (const t of T) { out[t] = []; for (let f = 0; ; f += 1000) { const rows = await q(SB.from(t).select("*").range(f, f + 999)); out[t].push(...rows); if (rows.length < 1000) break; } }
      const blob = new Blob([JSON.stringify({app: "bst-os", exportedAt: new Date().toISOString(), tables: out}, null, 1)], {type: "application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `bst-os-cadangan-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      toast("Cadangan diunduh."); });
  }
};

const RENDER = {beranda: vBeranda, kasir: vKasir, prep: vPrep, closing: vClosing, absensi: vAbsensi, stok: vStok, order: vOrder, pembelian: vPembelian, laporan: vLaporan, analitik: vAnalitik, pengaturan: vPengaturan};

/* ---------- boot ---------- */
async function boot() {
  if (!CFG.url) { $("#root").innerHTML = `<div class="auth"><div class="empty">config.js tidak ditemukan.</div></div>`; return; }
  const {data: {session}} = await SB.auth.getSession();
  if (session) { try { await start(session); return; } catch (e) { console.error(e); } }
  renderAuth();
}
boot();

const BUILD = "{{BUILD}}";
async function checkUpdate() { try { const t = await (await fetch(location.pathname + "?u=" + Date.now(), {cache: "no-store"})).text(); if (t.includes('const BUILD = "') && !t.includes('const BUILD = "' + BUILD + '"')) showUpdate(); } catch (e) {} }
function showUpdate() { if ($("#upd")) return; const d = document.createElement("div"); d.id = "upd"; d.className = "upd"; d.setAttribute("role", "status"); d.innerHTML = '<span>Versi baru BST OS tersedia</span><button class="btn sm">Muat ulang</button>'; d.querySelector("button").onclick = () => location.reload(); document.body.appendChild(d); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
